<svg width="600" height="340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <!-- Background -->
  <rect width="600" height="340" fill="#0d1b2a"/>

  <!-- Left sidebar -->
  <rect x="0" y="0" width="185" height="340" fill="#111f30"/>

  <!-- Sidebar header -->
  <rect x="12" y="14" width="28" height="28" rx="6" fill="#25d366"/>
  <text x="48" y="24" font-size="11" font-weight="700" fill="#ffffff">WhatsApp</text>
  <text x="48" y="37" font-size="9" fill="#64748b">Automation Dashboard</text>

  <!-- Stat 1 -->
  <rect x="12" y="56" width="162" height="52" rx="7" fill="#1a2d42"/>
  <text x="24" y="73" font-size="20" font-weight="800" fill="#ffffff">847</text>
  <text x="24" y="87" font-size="9" fill="#64748b">Messages automated today</text>
  <rect x="148" y="63" width="18" height="18" rx="4" fill="#25d366" opacity="0.2"/>
  <text x="153" y="76" font-size="10" fill="#25d366">↑</text>

  <!-- Stat 2 -->
  <rect x="12" y="116" width="162" height="52" rx="7" fill="#1a2d42"/>
  <text x="24" y="133" font-size="20" font-weight="800" fill="#25d366">&lt; 2s</text>
  <text x="24" y="147" font-size="9" fill="#64748b">Average response time</text>

  <!-- Stat 3 -->
  <rect x="12" y="176" width="162" height="52" rx="7" fill="#1a2d42"/>
  <text x="24" y="193" font-size="20" font-weight="800" fill="#ffffff">94%</text>
  <text x="24" y="207" font-size="9" fill="#64748b">Queries resolved by bot</text>

  <!-- Live indicator -->
  <circle cx="24" cy="258" r="5" fill="#25d366"/>
  <text x="36" y="262" font-size="10" font-weight="600" fill="#25d366">47 active conversations</text>
  <text x="24" y="278" font-size="9" fill="#64748b">Updated live</text>

  <!-- Bot active badge -->
  <rect x="16" y="298" width="120" height="24" rx="12" fill="#25d366" opacity="0.15"/>
  <circle cx="30" cy="310" r="4" fill="#25d366"/>
  <text x="40" y="314" font-size="9" font-weight="600" fill="#25d366">Bot Active — All Flows</text>

  <!-- Right chat panel -->
  <rect x="185" y="0" width="415" height="340" fill="#e5ddd5"/>

  <!-- Chat header -->
  <rect x="185" y="0" width="415" height="50" fill="#075e54"/>
  <circle cx="213" cy="25" r="16" fill="#128c7e"/>
  <text x="215" y="19" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">ST</text>
  <text x="237" y="20" font-size="11" font-weight="600" fill="#ffffff">Customer +91 87654 32198</text>
  <text x="237" y="34" font-size="9" fill="rgba(255,255,255,0.75)">● Automated responses enabled</text>
  <rect x="556" y="15" width="34" height="20" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="573" y="28" font-size="8" fill="#ffffff" text-anchor="middle">Bot</text>

  <!-- Message 1 - Customer -->
  <rect x="197" y="62" width="195" height="38" rx="7" fill="#ffffff" filter="url(#shadow)"/>
  <text x="210" y="77" font-size="10" fill="#262626">Where is my parcel? #TI-4821</text>
  <text x="210" y="91" font-size="8" fill="#9ca3af">10:42 AM</text>

  <!-- Message 2 - Bot -->
  <rect x="383" y="110" width="207" height="60" rx="7" fill="#dcfce7"/>
  <text x="395" y="126" font-size="10" fill="#262626">Your parcel #TI-4821 is out</text>
  <text x="395" y="140" font-size="10" fill="#262626">for delivery today. 🚚</text>
  <text x="395" y="156" font-size="10" font-weight="600" fill="#065f46">ETA: 2:00 PM – 4:00 PM</text>
  <text x="548" y="165" font-size="8" fill="#9ca3af">10:42 ✓✓</text>

  <!-- Bot label -->
  <rect x="383" y="174" width="72" height="16" rx="8" fill="#dcfce7"/>
  <circle cx="392" cy="182" r="3.5" fill="#25d366"/>
  <text x="399" y="185" font-size="7.5" fill="#065f46" font-weight="600">Automated</text>

  <!-- Message 3 - Customer -->
  <rect x="197" y="200" width="175" height="28" rx="7" fill="#ffffff"/>
  <text x="210" y="214" font-size="10" fill="#262626">Can I change the address?</text>
  <text x="210" y="223" font-size="8" fill="#9ca3af">10:44 AM</text>

  <!-- Message 4 - Bot -->
  <rect x="365" y="238" width="225" height="50" rx="7" fill="#dcfce7"/>
  <text x="377" y="253" font-size="10" fill="#262626">Sure! Reply with your new</text>
  <text x="377" y="267" font-size="10" fill="#262626">address to update delivery:</text>
  <text x="377" y="281" font-size="9" font-weight="600" fill="#065f46">NEW ADDRESS: [your address]</text>

  <!-- Input bar -->
  <rect x="185" y="310" width="415" height="30" fill="#f0f0f0"/>
  <rect x="197" y="315" width="340" height="20" rx="10" fill="#ffffff"/>
  <text x="215" y="328" font-size="9" fill="#c4c4c4">Type a message...</text>
  <circle cx="572" cy="325" r="10" fill="#25d366"/>
  <text x="572" y="329" font-size="9" fill="#ffffff" text-anchor="middle">▶</text>
</svg>
